---
- name:  my CISCO backup playbook
  hosts:  cisco
  gather_facts:  false
  vars:
    backup_root:  ./backups
  tasks:
    - name:  make sure backup file exists
      ansible.builtin.file:
          path: "{{backup_root}}"
          state:  directory
      run_once:  true
    - name:  ensure the devices folder exists
      ansible.builtin.file:
        path:  "{{backup_root}}/{{inventory_hostname}}"
        state:  directory
    - name:  run show running-config on remote devices
      cisco.ios.ios_command:
        commands:
          - show running-config
      register:  config
    - name: get time
      ansible.builtin.command:  date +%Y%m%d_%H%M%S
      register:  timestamp
      changed_when:  false
    - name:  save the configuration to a file
      ansible.builtin.copy:
        content:  "{{config.stdout[0]}}"
        dest:  "{{backup_root}}/{{inventory_hostname}}/running-config_{{timestamp.stdout}}.txt"
    - name: inspect the result
      ansible.builtin.debug:
        var:  config

---
- name:  Find the device that has the desired Ip address
  gather_facts:  false
  hosts:  cisco
  vars_prompt:
    - name:  target_ip
      prompt:  Enter the IP address to search
      private:  false
  tasks:


    - name:  checking if the IP format is fine
      ansible.builtin.assert:
        that:
          - target_ip is regex('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg:  "'{{target_ip}}' is not a valid IPv4 address"
      run_once:  true


    - name:  getting the interfaces tables
      cisco.ios.ios_command:
        commands:
          -  show ip inter brief
      register:  device


    - name:  find the device that has the IP
      ansible.builtin.debug:
       msg:  "{{target_ip}} is configured on {{inventory_hostname}}"
      when:  ('' ~ target_ip ~ '') in device.stdout[0]
